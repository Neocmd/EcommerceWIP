name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy_production:
    name: Deploy to Azure App Service (Production)
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore Ecommerce.sln

      - name: Build
        run: dotnet build Ecommerce.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Ecommerce/Ecommerce.csproj --configuration Release --output out

      - name: Deploy to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: out
